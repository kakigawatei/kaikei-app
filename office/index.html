<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=36">
<link rel="icon" href="icon-192.png?v=36">
<title>AIオフィス</title>
<style>
  :root{
    --hh:76px; --ch:104px; --leftw:38vw; --officeh:300px; --gcols:2; --grows:5;
    --bg:#f6f4ef; --card:#fff; --ink:#1d2430; --sub:#6b7480;
    --line:#e4e0d7; --accent:#2f6f4e; --warn:#c0392b;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body.dropping #room{outline:3px dashed var(--accent);outline-offset:-6px}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;letter-spacing:.02em}
  .ver{font-size:11px;color:#8a94a0;font-weight:400}
  .hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .waitbox{font-size:12.5px;font-weight:700;color:#8a3b12;background:#fdecdc;border:1px solid #f4c9a8;
    border-radius:999px;padding:4px 11px;cursor:pointer}
  .waitbox.zero{color:var(--accent);background:#e6f3ec;border-color:#bfe0cd;cursor:default}
  .newver{margin-top:8px;font-size:12.5px;background:#fff3cd;color:#6b4e00;border:1px solid #f1d98a;
    border-radius:10px;padding:7px 11px;display:flex;align-items:center;gap:10px}
  .newver button{border:0;border-radius:8px;background:#6b4e00;color:#fff;font:inherit;font-weight:700;
    padding:5px 11px;cursor:pointer}
  .lp{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:#cfd6dd}
  .lp.free{background:#2ecc71} .lp.busy{background:#f1c40f} .lp.wait{background:#e74c3c;box-shadow:0 0 6px #e74c3c}
  .chip{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;margin-top:6px;margin-right:4px}
  .chip.busy{background:#e8eefc;color:#2c4a9a} .chip.free{background:#e6f3ec;color:var(--accent)}
  .chip.wait{background:#fdecdc;color:#8a3b12}
  .lamp{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12px;color:var(--sub)}
  .legend{margin-left:auto;font-size:11px;color:var(--sub);white-space:nowrap}
  .legend i{margin-right:3px;margin-left:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:#bbb}
  .dot.ok{background:#2ecc71} .dot.ng{background:var(--warn)}
  main{padding:14px 16px 40px;max-width:1000px;margin:0 auto}
  .office{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    margin:0 auto 14px;background:var(--card);width:fit-content;max-width:100%}
  .office{aspect-ratio:1400/924}
  .office #bg{display:block;width:100%;height:100%;max-width:100%;object-fit:cover;object-position:50% 100%}
  .face{position:absolute;left:84%;top:-10%;transform:translateX(-50%);width:40%;
    pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
  .seat{position:absolute;transform:translate(-50%,-50%);width:13%;height:17%;border:0;
    background:transparent;border-radius:14%;cursor:pointer;padding:0}
  .seat:active{background:rgba(47,111,78,.16)}
  /* 名札は席の枠の「下」に出す＝キャラの顔や体に被らない。状態の丸は名札の中 */
  .seat .tag{position:absolute;left:50%;top:100%;margin-top:2px;transform:translateX(-50%);white-space:nowrap;
    background:rgba(255,255,255,.92);color:#1d2430;border-radius:999px;padding:1px 7px 1px 5px;
    font-size:clamp(8px,2.2vw,11.5px);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.18);
    display:inline-flex;align-items:center;gap:4px;line-height:1.5}
  .seat.up .tag{top:90%;margin-top:0}   /* 下段: 顔より下から始めて、絵の下端の手前で収める */
  .seat .sdot{width:7px;height:7px;border-radius:50%;background:#cfd6dd;flex:0 0 auto}
  .seat .tn{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
  .seat .rl{display:none;font-size:8.5px;font-weight:400;color:#5a6470;white-space:nowrap}
  .seat.m-free .sdot{background:#2ecc71}
  .seat.m-busy .sdot{background:#f1c40f}
  .seat.m-wait .sdot{background:#e74c3c;box-shadow:0 0 0 2px #fff,0 0 6px #e74c3c}
  .seat.none .tag{opacity:.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 13px 12px;
    text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
  .tile:active{transform:scale(.985)}
  .tile .nm{font-weight:700;font-size:15px}
  .tile .role{display:block;font-size:11.5px;color:var(--sub);margin-top:3px;font-weight:400}
  .tile .last{font-size:11.5px;color:var(--sub);margin-top:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:29px}
  .badge{display:inline-block;margin-top:8px;font-size:11px;padding:2px 8px;border-radius:999px;
    background:#eef1ee;color:var(--sub)}
  .badge.sending{background:#fff3cd;color:#8a6d1f}
  .badge.done{background:#e6f3ec;color:var(--accent)}

  /* 会話画面 */
  #room{display:none;position:fixed;left:0;right:0;top:0;bottom:var(--kb, 0px);z-index:20;background:var(--bg);flex-direction:column}
  #room.on{display:flex}
  .rhead{display:flex;align-items:center;gap:10px;max-width:820px;width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
    border-bottom:1px solid var(--line);background:var(--bg)}
  .back{border:0;background:none;font:inherit;color:var(--accent);font-size:16px;font-weight:700;padding:8px 6px;margin:-4px 0;cursor:pointer}
  .rname{font-weight:700}
  .log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;
    width:100%;max-width:820px;margin:0 auto}
  .bub{max-width:84%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;
    word-break:break-word;align-self:flex-end;background:#dbeee2}
  .bub .t{display:block;font-size:10.5px;color:var(--sub);margin-top:4px}
  .bub.them{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  .bub{-webkit-user-select:text;user-select:text}
  .tools{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
  .copy{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;
    border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:8px;
    font-size:15px;line-height:1;cursor:pointer}
  .copy:active{transform:scale(.94)}
  .copy.done{background:var(--accent);border-color:var(--accent);color:#fff;font-size:13px}
  .imgwrap{position:relative;display:inline-block;max-width:100%}
  .pics{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
  .pics img{max-height:150px;width:auto;margin:0}
  .pics .imgwrap{flex:0 1 auto}
  .imgwrap .copy.img{position:absolute;right:6px;bottom:10px;opacity:.92}
  .pick{display:block;width:100%;margin-top:7px;border:1px solid var(--accent);background:var(--accent);
    color:#fff;font:inherit;font-size:13.5px;font-weight:700;border-radius:10px;padding:10px 12px;
    cursor:pointer;text-align:left}
  .pick:disabled{opacity:.55}
  .pick.done{background:#8aa79a;border-color:#8aa79a}
  @media (prefers-color-scheme:dark){ .copy{background:#22392f} }
  .bub b{font-weight:700}
  .mic.on{background:#ffe3e3;border-color:#e88;animation:micblink 1s infinite}
  @keyframes micblink{50%{background:#fff}}
  /* 入力中は入力欄を上へ（iPadのキーボードに隠れないように） */
  body.typing #room{top:var(--ch);bottom:0}
  body.typing .composer{position:fixed;left:0;right:0;top:0;bottom:auto;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  body.pin .composer{box-shadow:none}
  body.kbd .office{display:none}
  body.kbd .grid{display:none}
  .bub a.file{display:inline-block;margin:4px 6px 4px 0;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-decoration:none;font-size:13px}
  .bub a.file:before{content:"📎 "}
  .bub .imgwrap img{min-height:120px;background:#e9e6df}
  .more{display:block;margin:6px auto 10px;padding:8px 16px;border:1px solid #cfcac0;border-radius:999px;background:#fff;color:#444;font-size:13px}
  .bub a{color:var(--accent);text-decoration:underline;word-break:break-all}
  .refresh{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;margin-left:auto;padding:6px}
  .empty{color:var(--sub);font-size:13px;text-align:center;margin-top:30px;line-height:1.7}
  .newpill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--ch) + 14px);z-index:3;
    border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-size:12.5px;font-weight:700;
    padding:7px 14px;box-shadow:0 3px 10px rgba(0,0,0,.2);cursor:pointer}
  @media (max-width:899px){ .newpill{bottom:calc(env(safe-area-inset-bottom) + 96px)} }
  body.pin .newpill{bottom:16px;padding:10px 18px;font-size:14px}
  .composer{border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background:var(--card);display:flex;gap:9px;align-items:flex-end}
  .cwrap{background:var(--card)}
  .composer{max-width:820px;margin:0 auto}
  textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;
    resize:none;max-height:160px;background:#fff;color:var(--ink)}
  .send{border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;
    padding:11px 16px;cursor:pointer}
  .send:disabled{opacity:.45}
  textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pic{border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:19px;
    padding:8px 11px;cursor:pointer;line-height:1.2}
  .pic:disabled{opacity:.45}
  .bub img{display:block;max-width:100%;max-height:210px;width:auto;border-radius:9px;margin-bottom:5px;cursor:zoom-in}
  .bub img.big{max-height:none;width:100%}
  .thumb{padding:0 12px 8px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub)}
  .thumb{flex-wrap:wrap}
  .thumb .th{position:relative;display:inline-block}
  .thumb img{height:52px;border-radius:8px;border:1px solid var(--line);display:block}
  .thumb .th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;
    background:var(--warn);color:#fff;font:inherit;font-size:12px;line-height:1;cursor:pointer;padding:0}
  .thumb .cnt{font-size:11px;color:var(--sub)}
  .hint{font-size:11px;color:var(--sub);padding:0 14px 8px;max-width:820px;width:100%;margin:0 auto}
  dialog{border:0;border-radius:16px;padding:20px;max-width:320px;width:86%}
  dialog input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:10px}
  dialog button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--accent);
    color:#fff;font:inherit;font-weight:700}
  /* スマホ: オフィス図はスクロールしても上に残す（ヘッダーの直下に固定） */
  @media (max-width:899px){
    .office{position:sticky;top:var(--hh);z-index:4;box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
  }
  /* パソコン＝3段構え: ヘッダー ／ 左オフィス＋右会話 ／ 下いっぱいの入力欄 */
  @media (min-width:900px){
    body{overflow:hidden}
    main{position:fixed;left:0;top:var(--hh);bottom:calc(var(--ch) + var(--kb, 0px));width:var(--leftw);max-width:none;
      padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
    .office{margin:0 auto;flex:0 0 auto;min-height:0;width:100%;height:var(--officeh)}
    .office #bg{width:100%;height:100%;max-width:none;max-height:none}
    /* 10人ぶんが必ず入るように、2列×5行ぴったりに割り付ける */
    .grid{flex:1 1 auto;min-height:0;overflow:hidden;
      display:grid;grid-template-columns:repeat(var(--gcols,2),1fr);grid-template-rows:repeat(var(--grows,5),1fr);gap:6px}
    .grid.compact .tile .last{display:none}
    .grid.compact .tile .badge{display:none}
    .grid.compact .tile{padding:4px 9px}
    .grid.compact .tile{padding:3px 8px;justify-content:center}
    .grid.compact .tile .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;line-height:1.25}
    .grid.compact .tile .role{display:block;margin:1px 0 0;font-size:9.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tile{padding:6px 9px;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
    .tile .nm{font-size:12px}
    .tile .role{display:block;font-size:10px;margin-top:1px}
    .tile .last{font-size:10.5px;margin-top:2px;min-height:0;-webkit-line-clamp:2;line-height:1.35}
    .badge{display:none}
    #room.on{position:fixed;left:var(--leftw);right:0;top:var(--hh);bottom:calc(var(--ch) + var(--kb, 0px));width:auto;height:auto;
      border-left:1px solid var(--line);box-shadow:none}
    .seat .tag{padding:2px 8px 2px 6px;border-radius:9px}
    .seat .rl{display:block}
    .rhead{max-width:none;padding-top:12px}
    .log,.hint{max-width:none}
    .log{padding:12px 16px}
    .bub{font-size:13.5px;line-height:1.5;max-width:92%}
    .bub img{max-height:180px}
    .pick{font-size:12.5px;padding:8px 11px}
    .hint{display:none}
    .thumb{max-width:none}
    .composer{position:fixed;left:0;right:0;bottom:var(--kb, 0px);height:auto;max-width:none;margin:0;
      z-index:21;border-top:1px solid var(--line);align-items:center;padding:12px 16px}
    body.typing .composer{top:var(--hh);bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
    body.typing main{top:calc(var(--hh) + var(--ch));bottom:0}
    body.typing #room.on{top:calc(var(--hh) + var(--ch));bottom:0}
    textarea{max-height:84px;font-size:15px}
    .send{padding:13px 26px;font-size:15px}
    .pic{padding:10px 13px;font-size:21px}
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15181c;--card:#1e232a;--ink:#eef1f5;--sub:#98a2ae;--line:#2c333c;--accent:#4fb383}
    .bub{background:#26443a} .badge{background:#262d35} .badge.done{background:#22392f;color:#7fd0aa}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>AIオフィス <span class="ver" id="ver" title="タップで合言葉を入れ直す"></span></h1>
    <div class="waitbox" id="waitbox" hidden></div>
  </div>
  <div class="lamp"><span class="dot" id="dot"></span><span id="lamp">確認中…</span>
    <span class="legend"><i class="lp free"></i>手あき <i class="lp busy"></i>作業中 <i class="lp wait"></i>返事待ち</span></div>
  <div class="newver" id="newver" hidden>新しい版があります <button id="doreload">更新する</button></div>
</header>

<main>
  <div class="office" id="office">
    <img src="office_bg.jpg?v=44" alt="AIオフィス" id="bg">
  </div>
  <div class="grid" id="grid"></div>
</main>

<section id="room">
  <div class="rhead">
    <button class="back" id="back">‹ もどる</button>
    <div><div class="rname" id="rname"></div></div>
    <button class="refresh" id="reload">更新</button>
  </div>
  <div class="log" id="log"></div>
  <button class="newpill" id="newpill" hidden>↓ 新しい返事</button>
  <div class="hint" id="hint"></div>
  <div class="thumb" id="thumb" hidden></div>
  <div class="composer">
    <button class="pic" id="pic" title="写真を送る">📷</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <textarea id="box" rows="1" placeholder="話しかける"></textarea>
    <button class="send" id="send">送る</button>
  </div>
</section>

<dialog id="gate">
  <div style="font-weight:700">合言葉</div>
  <div style="font-size:12.5px;color:#6b7480;margin-top:6px">この端末では初回だけ聞きます。</div>
  <input id="pass" type="password" autocomplete="off">
  <button id="ok">はじめる</button>
</dialog>

<script>
var FB = { key:"AIzaSyDtDZIEQtBzjujnpTDcXt1QeEU2r-wbg74", proj:"kakigawatei-franchise" };
var INBOX = "ai_office_inbox", STATUS = "ai_office_status", FEED = "ai_office_feed";
var feed = {rooms:{}}, feedTimer = null;

var STAFF = [
  {id:"1532176222946197635", nm:"コン",   role:"LINE秘書",       x:16.8, y:18.9},
  {id:"1532175887494025398", nm:"ジニー", role:"ながおか探検録", x:41.1, y:15.0},
  {id:"1532176144999252038", nm:"リー",   role:"広告・動画",     x:67.1, y:17.7},
  {id:"1532176037109174503", nm:"ジョー", role:"経理・会計",     x:91.1, y:19.3},
  {id:"1532724627934154842", nm:"ポム",   role:"AI事業",         x:27.5, y:54.5},
  {id:"1532724546732425306", nm:"セレン", role:"リリース担当",   x:48.2, y:53.4},
  {id:"1532171159645458535", nm:"かねつぐ", role:"お客様窓口", x:67.9, y:53.4},
  {id:"1517471809392476282", nm:"masa", role:"代表・バウ本部", x:87.9, y:52.0, h:32},
  {id:"1542160237723648021", nm:"ずんだ", role:"柿川亭アプリ",   x:32.9, y:84.9},
  {id:"1542160436487528509", nm:"さくら", role:"山形出店",       x:53.2, y:85.3}
];

/* ---------- Firebase（匿名ログイン＋Firestore REST） ---------- */
var tok = null, exp = 0;
function jfetch(u, o){ return fetch(u, o).then(function(r){
  if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t.slice(0,120)); });
  return r.json(); }); }
function auth(){
  if (tok && Date.now() < exp) return Promise.resolve(tok);
  var r = null; try { r = localStorage.getItem("office_refresh"); } catch(e){}
  if (r) {
    return jfetch("https://securetoken.googleapis.com/v1/token?key=" + FB.key, {
      method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:"grant_type=refresh_token&refresh_token=" + encodeURIComponent(r)
    }).then(function(d){ tok = d.id_token; exp = Date.now() + (d.expires_in-60)*1000; return tok; })
      .catch(anon);
  }
  return anon();
}
function anon(){
  return jfetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + FB.key, {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({returnSecureToken:true})
  }).then(function(d){
    tok = d.idToken; exp = Date.now() + (d.expiresIn-60)*1000;
    try { localStorage.setItem("office_refresh", d.refreshToken); } catch(e){}
    return tok;
  });
}
function docUrl(id){
  return "https://firestore.googleapis.com/v1/projects/" + FB.proj +
         "/databases/(default)/documents/shime_docs/" + id;
}
function readDoc(id){
  return auth().then(function(t){
    return fetch(docUrl(id), {headers:{Authorization:"Bearer " + t}});
  }).then(function(r){
    if (r.status === 404) return {};
    if (!r.ok) throw new Error("read " + r.status);
    return r.json();
  }).then(function(d){
    var raw = d && d.fields && d.fields.json && d.fields.json.stringValue;
    if (!raw) return {};
    try { return JSON.parse(raw); } catch(e){ return {}; }
  });
}
function writeDoc(id, obj){
  return auth().then(function(t){
    return jfetch(docUrl(id), {
      method:"PATCH",
      headers:{Authorization:"Bearer " + t, "Content-Type":"application/json"},
      body: JSON.stringify({fields:{json:{stringValue: JSON.stringify(obj)}}})
    });
  });
}

/* ---------- 合言葉 ---------- */
var pass = null;
try { pass = localStorage.getItem("office_pass"); } catch(e){}
if (!pass) {

/* ---------- ローカル履歴 ---------- */
function hist(room){
  try { return JSON.parse(localStorage.getItem("office_log_" + room) || "[]"); } catch(e){ return []; }
}
function pushHist(room, item){
  var a = hist(room); a.push(item); a = a.slice(-60);
  try { localStorage.setItem("office_log_" + room, JSON.stringify(a)); } catch(e){}
}

/* ---------- 一覧 ---------- */
function drawGrid(){
  var g = document.getElementById("grid"); g.innerHTML = "";
  STAFF.filter(function(x){ return x.id; }).forEach(function(s){
    var rows = (feed.rooms && feed.rooms[s.id]) || [];
    var h = hist(s.id), last = h.length ? h[h.length-1] : null;
    if (rows.length) {
      var r = rows[rows.length-1];
      last = {text:(r.me ? s.nm + "：" : "") + (r.text || (r.img && r.img.length ? "写真" : "")),
              ts:tsOf(r.ts), ok:true, thumb:(r.img && r.img.length ? r.img[0] : null)};
    }
    var b = document.createElement("button");
    var md0 = mood(s);
    b.className = "tile " + md0;
    var plain = last ? String(last.text || "").replace(/\*\*/g, "").replace(/\s+/g, " ").trim() : "";
    b.innerHTML = '<div class="nm"><span class="lp ' + md0 + '" title="' + MOODJA[md0] + '"></span>' + s.nm +
      '<span class="role">' + s.role + '</span></div>' +
      '<div class="last">' + (last ? ((last.thumb ? "📷 " : "") + (esc(plain).slice(0,60) || "写真")) : "—") + '</div>' +
      (last ? '<span class="badge ' + (last.ok ? "done" : "sending") + '">' +
        (last.ok ? "" : "送信中 ") + when(last.ts) + '</span>' : "");
    b.onclick = function(){ openRoom(s); };
    g.appendChild(b);
  });
}
function esc(s){ return String(s).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; }); }
function when(ts){
  var d = new Date(ts), n = new Date();
  var hm = ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
  return d.toDateString() === n.toDateString() ? hm : (d.getMonth()+1) + "/" + d.getDate();
}

/* ---------- 会話 ---------- */
var cur = null;
function openRoom(s){
  cur = s;
  document.getElementById("rname").textContent = s.nm + "（" + s.role + "）";
  document.getElementById("hint").textContent = "返事はここに出ます（Discordの「" + s.nm + "」の部屋にも残ります）";
  forceBottom = true; drawLog();
  loadRoomHist(s.id);
  document.getElementById("room").classList.add("on");
  if (location.hash !== "#room") history.pushState({room:1}, "", "#room");
  /* スマホでは勝手にキーボードを出さない（読む邪魔になる）。物理キーボードの端末だけ入力欄へ */
  if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) document.getElementById("box").focus();
  fitLayout();
  loadFeed();
  if (feedTimer) clearInterval(feedTimer);
  feedTimer = setInterval(loadFeed, 15000);
}
var LOG_STEP = 40;            /* 一度に描く件数 */
var roomHist = {};            /* 部屋ごとの履歴（ai_office_room_<id>） */
var histLoading = false;
function roomRows(id){
  var base = (feed.rooms && feed.rooms[id]) || [];
  var h = roomHist[id] || [];
  if (!h.length) return base;
  var have = {}; h.forEach(function(m){ have[m.id] = 1; });
  return h.concat(base.filter(function(m){ return !have[m.id]; }));
}
function loadRoomHist(id){
  return readDoc("ai_office_room_" + id).then(function(d){
    var msgs = (d && d.msgs) || [];
    var before = (roomHist[id] || []).length;
    if (msgs.length && msgs.length !== before) { roomHist[id] = msgs; if (cur && cur.id === id) drawLog(); }
    return msgs.length;
  }).catch(function(){ return 0; });
}
/* Discordからさらに前を取ってきてもらう */
function loadOlder(){
  if (!cur || histLoading) return;
  var rows = roomRows(cur.id);
  if (!rows.length) return;
  histLoading = true;
  var btn = document.getElementById("logolder"); if (btn) { btn.textContent = "Discordから読み込み中…"; btn.disabled = true; }
  var rid = "h" + Date.now();
  var id = cur.id, n0 = rows.length;
  writeDoc("ai_office_req", {hist:{room:id, before:rows[0].id, rid:rid}}).then(function(){
    var tries = 0;
    (function poll(){
      tries++;
      loadRoomHist(id).then(function(n){
        if (n > n0 || tries >= 8) {
          histLoading = false;
          if (n > n0) logShown[id] = (logShown[id] || LOG_STEP) + (n - n0);
          drawLog();
          if (n <= n0) { var b2 = document.getElementById("logolder"); if (b2) { b2.textContent = "これより前はありません"; b2.disabled = true; } }
        } else setTimeout(poll, 2500);
      });
    })();
  }).catch(function(){ histLoading = false; });
}
/* Discordの添付は media.discordapp.net の縮小版（幅900px以内）を読む。署名付きURLでも width/height は許可されている */
function thumbUrl(u){
  if (!/https:\/\/(cdn|media)\.discordapp\.(com|net)\/attachments\//.test(u)) return u;
  var v = u.replace("https://cdn.discordapp.com/", "https://media.discordapp.net/");
  return v + (v.indexOf("?") >= 0 ? "&" : "?") + "width=900&height=900";
}
var logShown = {};            /* 部屋ごとに何件まで描いているか */
var lastLogKey = "";          /* 直前に描いた内容の指紋（同じなら描き直さない） */
function drawLog(){
  var l = document.getElementById("log");
  var allRows = roomRows(cur.id);
  var lim = logShown[cur.id] || LOG_STEP;
  var start = Math.max(0, allRows.length - lim);
  var rows = allRows.slice(start);
  /* 内容が変わっていなければ描き直さない（15秒ごとの更新で画像が読み直されるのを防ぐ） */
  var key = cur.id + "|" + start + "|" + allRows.length + "|" + rows.map(function(m){ return m.id + ":" + (m.text || "").length + ":" + (m.img || []).length + ":" + (m.files || []).length; }).join(",") +
    "|" + hist(cur.id).map(function(m){ return m.ts + ":" + (m.ok ? 1 : 0); }).join(",");
  if (key === lastLogKey && !forceBottom && l.innerHTML) return;
  if (key === lastLogKey && forceBottom) { l.scrollTop = l.scrollHeight; hideNew(); forceBottom = false; return; }
  lastLogKey = key;
  var html = rows.map(function(m, i){
    var imgs = (m.img || []).map(function(u){
      return '<span class="imgwrap"><img src="' + thumbUrl(u) + '" data-orig="' + u + '" onerror="if(this.src!==this.getAttribute(\'data-orig\')){this.src=this.getAttribute(\'data-orig\');}" alt="" loading="lazy" decoding="async">' +
             '<button class="copy img" data-url="' + u + '" title="画像をコピー">🖼</button></span>';
    }).join("");
    if ((m.img || []).length > 1) imgs = '<div class="pics">' + imgs + '</div>';
    imgs += (m.files || []).map(function(f){
      return '<a class="file" href="' + f.url + '" target="_blank" rel="noopener">' + esc(f.name || "ファイル") + (f.size ? ' <small>(' + Math.round(f.size / 1024) + 'KB)</small>' : '') + '</a>';
    }).join("");
    var btn = (m.me && m.text) ? '<div class="tools"><button class="copy" data-i="' + i + '" title="この文をコピー">📋</button></div>' : "";
    var ch = m.me ? parseChoices(m.text) : [];
    var chHtml = ch.map(function(c){
      return '<button class="pick" data-msg="' + m.id + '" data-emoji="' + encodeURIComponent(c.emoji) +
             '">' + c.letter + " … " + esc(c.label) + '</button>';
    }).join("");
    return '<div class="bub ' + (m.me ? "them" : "") + '">' + imgs + md(m.text) + chHtml + btn +
      '<span class="t">' + when(tsOf(m.ts)) + (m.me ? " ・" + cur.nm : "") + '</span></div>';
  });
  /* まだDiscordに写っていない直近の送信ぶんを足す */
  var seen = rows.map(function(m){ return (m.text || "").trim(); });
  hist(cur.id).forEach(function(m){
    if (Date.now() - m.ts > 120000) return;
    if (m.text && seen.indexOf(m.text.trim()) >= 0) return;
    var ths = (m.thumbs && m.thumbs.length) ? m.thumbs : (m.thumb ? [m.thumb] : []);
    html.push('<div class="bub">' +
      (ths.length ? '<div class="pics">' + ths.map(function(u){ return '<img src="' + u + '" alt="">'; }).join("") + '</div>' : "") +
      esc(m.text) + '<span class="t">' + when(m.ts) + (m.ok ? " ・届いた" : " ・送信中") + '</span></div>');
  });
  if (start > 0) html.unshift('<button class="more" id="logmore">↑ 前の ' + Math.min(LOG_STEP, start) + ' 件を見る（残り ' + start + ' 件）</button>');
  else if (allRows.length >= 25) html.unshift('<button class="more" id="logolder">↑ もっと前を読む（Discordから）</button>');
  var atBottom = (l.scrollHeight - l.scrollTop - l.clientHeight) < 60 || !l.innerHTML;
  var keepTop = l.scrollTop, keepH = l.scrollHeight;
  l.innerHTML = html.length ? html.join("")
    : '<div class="empty">まだやり取りがありません。<br>下の欄に打つか、マイクで話しかけてください。</div>';
  var ob = document.getElementById("logolder");
  if (ob) ob.onclick = loadOlder;
  var mb = document.getElementById("logmore");
  if (mb) mb.onclick = function(){
    logShown[cur.id] = (logShown[cur.id] || LOG_STEP) + LOG_STEP;
    var before = l.scrollHeight;
    drawLog();
    l.scrollTop = l.scrollTop + (l.scrollHeight - before);   /* 見ていた位置を保つ */
  };
  Array.prototype.forEach.call(l.querySelectorAll(".bub img"), function(im){
    im.onclick = function(){
      im.className = im.className ? "" : "big";
      var o = im.getAttribute("data-orig");
      if (im.className === "big" && o && im.src !== o) im.src = o;
    };
  });
  Array.prototype.forEach.call(l.querySelectorAll(".imgwrap"), function(w){
    if (w.querySelector("img.big")) w.style.display = "block";
  });
  Array.prototype.forEach.call(l.querySelectorAll(".pick"), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      Array.prototype.forEach.call(b.parentNode.querySelectorAll(".pick"), function(x){ x.disabled = true; });
      b.className = "pick done"; b.textContent = "\u2705 " + b.textContent;
      sendChoice(b.getAttribute("data-msg"), decodeURIComponent(b.getAttribute("data-emoji")));
    };
  });
  Array.prototype.forEach.call(l.querySelectorAll(".copy"), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var u = b.getAttribute("data-url");
      if (u) { copyImage(u, b); return; }
      var raw = (rows[+b.getAttribute("data-i")].text || "").replace(/\*\*/g, "");
      copyText(raw, b);
    };
  });
  if (atBottom || forceBottom) { l.scrollTop = l.scrollHeight; hideNew(); }
  else { l.scrollTop = keepTop; showNew(); }
  forceBottom = false;
}
var forceBottom = false;
var hasNew = false;
function showNew(){ hasNew = true; updatePill(); }
function hideNew(){ hasNew = false; updatePill(); }
/* 上にスクロールしている間は「↓ 最新へ」を常に出す。新着があるときは文言を変える */
function updatePill(){
  var l = document.getElementById("log"), n = document.getElementById("newpill");
  if (!l || !n) return;
  var up = (l.scrollHeight - l.scrollTop - l.clientHeight) > 120;
  n.hidden = !(up || hasNew);
  n.textContent = hasNew ? "↓ 新しい返事" : "↓ 最新へ";
}
document.getElementById("log").addEventListener("scroll", function(){
  var l = this;
  if ((l.scrollHeight - l.scrollTop - l.clientHeight) < 40) hasNew = false;
  updatePill();
}, {passive:true});
/* 選択肢を押したら、Discordのその発言に絵文字を付けにいく＝Discordで押したのと同じ扱いになる */
function sendChoice(msgId, emoji){
  readDoc(INBOX).then(function(d){
    var msgs = d.msgs || [];
    var cid = "c" + Date.now() + Math.floor(Math.random()*1000);
    try { var sent = JSON.parse(localStorage.getItem("office_sent") || "[]"); sent.push(cid); localStorage.setItem("office_sent", JSON.stringify(sent.slice(-50))); } catch(e){}
    msgs.push({ id:cid,
                room:cur.id, name:cur.nm, text:"", ts:Date.now(), pass:pass,
                react:{msg:msgId, emoji:emoji} });
    d.msgs = msgs.slice(-100);
    return writeDoc(INBOX, d);
  }).catch(function(e){ alert("\u9001\u308c\u307e\u305b\u3093\u3067\u3057\u305f\uff1a" + e.message); });
}
function copyText(t, btn){
  function done(){ btn.textContent = "✅"; btn.className = "copy done";
    setTimeout(function(){ btn.textContent = "📋"; btn.className = "copy"; }, 1600); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, function(){ fallback(t, done); });
  } else { fallback(t, done); }
}
/* 画像をPNGにしてクリップボードへ（SafariはPNGのみ・押した瞬間にClipboardItemを作る必要がある） */
function toPng(url){
  return fetch(url, {mode:"cors"}).then(function(r){ return r.blob(); }).then(function(b){
    return new Promise(function(res, rej){
      var im = new Image(), o = URL.createObjectURL(b);
      im.onload = function(){
        var c = document.createElement("canvas");
        c.width = im.naturalWidth; c.height = im.naturalHeight;
        c.getContext("2d").drawImage(im, 0, 0);
        URL.revokeObjectURL(o);
        c.toBlob(function(png){ png ? res(png) : rej(new Error("png")); }, "image/png");
      };
      im.onerror = function(){ URL.revokeObjectURL(o); rej(new Error("load")); };
      im.crossOrigin = "anonymous"; im.src = o;
    });
  });
}
function copyImage(url, btn){
  var ok = function(){ btn.textContent = "✅"; btn.className = "copy img done";
    setTimeout(function(){ btn.textContent = "🖼"; btn.className = "copy img"; }, 1600); };
  var ng = function(){ btn.textContent = "✋"; btn.title = "長押しして「写真に追加」";
    setTimeout(function(){ btn.textContent = "🖼"; }, 2600); };
  if (!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)) { ng(); return; }
  try {
    navigator.clipboard.write([ new ClipboardItem({ "image/png": toPng(url) }) ]).then(ok, ng);
  } catch(e){ ng(); }
}
function fallback(t, done){
  var ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ alert("コピーできませんでした"); }
  document.body.removeChild(ta);
}

/* ---------- 写真 ---------- */
var pending = [];     /* [{full:dataURL(送信用), thumb:dataURL(履歴表示用)}] 複数枚OK */
function drawThumbs(){
  var t = document.getElementById("thumb");
  if (!pending.length) { t.hidden = true; t.innerHTML = ""; return; }
  t.hidden = false; t.innerHTML = "";
  pending.forEach(function(p, i){
    var w = document.createElement("span"); w.className = "th";
    var im = new Image(); im.src = p.thumb; w.appendChild(im);
    var x = document.createElement("button"); x.textContent = "×"; x.title = "外す";
    x.onclick = function(){ pending.splice(i, 1); drawThumbs(); };
    w.appendChild(x); t.appendChild(w);
  });
  var sp = document.createElement("span"); sp.className = "cnt";
  sp.textContent = pending.length + "枚";
  t.appendChild(sp);
}

function shrink(file, maxSide, quality){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var w = img.width, h = img.height, r = Math.min(1, maxSide / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.round(w * r); c.height = Math.round(h * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("画像を読めません")); };
    img.src = url;
  });
}

/* Firestore の1通の上限(約1MB)に収まるまで落とす */
function fitForSend(file){
  var plan = [[1400,.72],[1200,.66],[1000,.6],[820,.55]];
  var i = 0;
  function step(){
    return shrink(file, plan[i][0], plan[i][1]).then(function(d){
      if (d.length < 700000 || i >= plan.length - 1) return d;
      i++; return step();
    });
  }
  return step();
}

document.getElementById("pic").onclick = function(){ document.getElementById("file").click(); };
document.getElementById("file").onchange = function(){
  var fs = Array.prototype.slice.call(this.files || []); this.value = "";
  fs.forEach(attachFile);
};
function attachFile(f){
  if (!f) return;
  if (pending.length >= 8) { alert("1通に付けられるのは8枚までです"); return; }
  var t = document.getElementById("thumb");
  t.hidden = false;
  Promise.all([fitForSend(f), shrink(f, 240, .6)]).then(function(a){
    pending.push({full:a[0], thumb:a[1]});
    drawThumbs();
  }).catch(function(e){
    drawThumbs(); alert("写真を読めませんでした：" + e.message);
  });
}

/* 貼り付け（Ctrl+V / Cmd+V）で画像を添付 */
function pickImages(dt){
  var out = [];
  if (!dt) return out;
  var files = dt.files || [];
  for (var i = 0; i < files.length; i++) if ((files[i].type || "").indexOf("image/") === 0) out.push(files[i]);
  if (!out.length) {
    var items = dt.items || [];
    for (var j = 0; j < items.length; j++) {
      if ((items[j].type || "").indexOf("image/") === 0) { var f = items[j].getAsFile(); if (f) out.push(f); }
    }
  }
  return out;
}
document.addEventListener("paste", function(e){
  if (!document.getElementById("room").classList.contains("on")) return;
  var fs = pickImages(e.clipboardData);
  if (fs.length) { e.preventDefault(); fs.forEach(attachFile); }
});
/* ドラッグ＆ドロップ（Finderの画像ファイルを会話に落とす） */
["dragover", "dragenter"].forEach(function(ev){
  document.addEventListener(ev, function(e){
    if (!document.getElementById("room").classList.contains("on")) return;
    e.preventDefault(); document.body.classList.add("dropping");
  });
});
document.addEventListener("dragleave", function(){ document.body.classList.remove("dropping"); });
document.addEventListener("drop", function(e){
  document.body.classList.remove("dropping");
  if (!document.getElementById("room").classList.contains("on")) return;
  e.preventDefault();
  pickImages(e.dataTransfer).forEach(attachFile);
});

/* パソコンのキーボードのときだけ Enter で送信（Shift+Enter は改行） */
box.addEventListener("keydown", function(e){
  if (e.key !== "Enter" || e.shiftKey) return;
  if (e.isComposing || e.keyCode === 229) return;      /* 日本語の変換中は送らない */
  if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
  e.preventDefault();
  document.getElementById("send").click();
});

document.getElementById("send").onclick = function(){
  var text = box.value.trim(); if ((!text && !pending.length) || !cur) return;
  var btn = this; btn.disabled = true;
  var shots = pending; pending = []; drawThumbs();
  var mid = "m" + Date.now() + Math.floor(Math.random()*1000);
  var item = {id:mid, text:text, ts:Date.now(), ok:false, thumb: shots.length ? shots[0].thumb : null,
              thumbs: shots.map(function(x){ return x.thumb; }), n: shots.length};
  pushHist(cur.id, item); box.value = ""; box.style.height = "auto"; forceBottom = true; drawLog();
  try { var sent = JSON.parse(localStorage.getItem("office_sent") || "[]"); sent.push(mid); localStorage.setItem("office_sent", JSON.stringify(sent.slice(-50))); } catch(e){}
  if (typeof fitLayout === "function") setTimeout(fitLayout, 0);

  var ids = shots.map(function(_, k){ return "ai_office_img_" + mid + (k ? "_" + k : ""); });
  var first = Promise.resolve();
  shots.forEach(function(sh, k){ first = first.then(function(){ return writeDoc(ids[k], {b64: sh.full}); }); });
  first.then(function(){ return readDoc(INBOX); }).then(function(d){
    var msgs = d.msgs || [];
    msgs.push({ id:mid, room:cur.id, name:cur.nm, text:text, ts:Date.now(), pass:pass,
                img: ids.length ? ids[0] : null, imgs: ids });
    d.msgs = msgs.slice(-100);
    return writeDoc(INBOX, d);
  }).then(function(){
    var a = hist(cur.id); if (a.length) { a[a.length-1].ok = true;
      try { localStorage.setItem("office_log_" + cur.id, JSON.stringify(a)); } catch(e){} }
    drawLog();
  }).catch(function(e){
    alert("送れませんでした：" + e.message);
  }).then(function(){ btn.disabled = false; });
};

/* ---------- 返事の取り込み（PCの受け取り係がDiscordを読んで置いてくれる） ---------- */
var feedSig = "";
function sigOf(d){
  var rooms = (d && d.rooms) || {}, out = [];
  Object.keys(rooms).sort().forEach(function(k){
    var a = rooms[k] || [], l = a.length ? a[a.length-1] : null;
    out.push(k + ":" + a.length + ":" + (l ? l.id : "") + ":" + (l ? (l.text || "").length : 0));
  });
  return out.join("|");
}
function loadFeed(){
  if (document.hidden) return Promise.resolve();          /* 裏にいる間は読まない（戻ったら即読む） */
  return readDoc(FEED).then(function(d){
    if (!(d && d.rooms)) return;
    var sg = sigOf(d);
    if (sg === feedSig) return;                            /* 変化なし＝描き直さない（これがカクつきの元） */
    feedSig = sg; feed = d;
    if (cur) { drawLog(); loadRoomHist(cur.id); } drawGridQuiet(); drawSeats(); drawWait();
  }).catch(function(){});
}

/* いまの様子を、直近のやり取りから決める */
var MOODJA = {busy:"作業中", free:"手あき", wait:"返事待ち"};
function drawWait(){
  var w = document.getElementById("waitbox");
  var names = STAFF.filter(function(x){ return x.id && mood(x) === "wait"; }).map(function(x){ return x.nm; });
  w.hidden = false;
  if (names.length) {
    w.className = "waitbox";
    w.textContent = "返事待ち " + names.length + "件： " + names.join("・");
    w.onclick = function(){ var st = STAFF.filter(function(x){ return x.nm === names[0]; })[0]; if (st) openRoom(st); };
  } else {
    w.className = "waitbox zero";
    w.textContent = "返事待ち なし";
    w.onclick = null;
  }
}
function mood(st){
  var rows = (st.id && feed.rooms && feed.rooms[st.id]) || [];
  if (!rows.length) return "free";
  var last = rows[rows.length-1];
  if (!last.me) return "busy";                       /* masaが投げた直後＝私が動いている */
  var t = (last.text || "").trim();
  /* 3日より前の質問は「返事待ち」に数えない（放置された古い問いで一覧を汚さない） */
  if (Date.now() - tsOf(last.ts) > 3 * 24 * 3600 * 1000) return "free";
  if (/[？?]$/.test(t) || parseChoices(t).length || /どちらにしますか|選んでください|決めてください/.test(t)) return "wait";
  /* 私が「これからやる」と言って60分以内＝作業中（例: 20分ください／直します／作り直します／進めます／確認します） */
  var WORKING = /\d+\s*分(ほど|くらい|程)?(ください|待って|で出します|で公開します)|(直し|作り直し|作り|進め|確認し|探し|調べ|やり|着手し|仕上げ|組み|送り|出し|公開し|用意し|外し|取り外し|変え|変更し|追加し|付け|入れ|書き換え|差し替え|試し|見てみ|考え|まとめ)ます|作業します|取りかかります|進めています|作業中です|少々お待ち|お待ちください/;
  if (WORKING.test(t) && Date.now() - tsOf(last.ts) < 60 * 60 * 1000) return "busy";
  return "free";
}
function drawSeats(){
  var o = document.getElementById("office");
  Array.prototype.forEach.call(o.querySelectorAll(".seat"), function(e){ e.remove(); });
  STAFF.forEach(function(st){
    if (st.x == null) return;
    var b = document.createElement("button");
    b.className = "seat" + (st.id ? "" : " none");
    b.style.left = st.x + "%"; b.style.top = st.y + "%";
    if (st.h) b.style.height = st.h + "%";   /* 背の高いキャラ（masa）は当たり判定を縦に伸ばす */
    var rows = (st.id && feed.rooms && feed.rooms[st.id]) || [];
    if (rows.length) b.className += " live";
    var md1 = mood(st);
    b.className += " m-" + md1;
    if (st.y > 74) b.className += " up";           /* 下段の席＝名札を席の上に（枠の下で切れるため） */
    var fh = st.face ? '<img class="face" src="faces/' + st.face + "_" + md1 + '.png?v=' + APP_VER + '" alt="">' : "";
    b.innerHTML = fh + '<span class="tag"><span class="sdot"></span><span class="tn">' + st.nm +
      '<span class="rl">' + st.role + '</span></span></span>';
    b.onclick = function(){
      if (!st.id) { alert(st.nm + "さんの部屋は、まだDiscordに作っていません。作るならmasaの一声で用意します。"); return; }
      openRoom(st);
    };
    o.appendChild(b);
  });
}
function drawGridQuiet(){ if (!document.getElementById("room").classList.contains("on")) drawGrid(); }
function md(t){
  var h = esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  /* [文字](URL) → リンク */
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function(_, a, u){
    return '<a href="' + u + '" target="_blank" rel="noopener">' + a + '</a>';
  });
  /* 生のURL（すでにリンクになっていないもの）→ リンク。末尾の句読点や閉じ括弧は含めない */
  h = h.replace(/(^|[^"'>=])(https?:\/\/[^\s<]+?)(?=[\s<）」。、]|$)/g, function(_, pre, u){
    return pre + '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
  });
  return h;
}
var CHOICE_EMOJI = ["🇦","🇧","🇨","🇩","🇪"];
function parseChoices(t){
  var out = [];
  (t || "").split("\n").forEach(function(line){
    var s2 = line.trim();
    for (var i = 0; i < CHOICE_EMOJI.length; i++) {
      if (s2.indexOf(CHOICE_EMOJI[i]) === 0) {
        var label = s2.slice(CHOICE_EMOJI[i].length).replace(/\*\*/g, "").trim();
        label = label.replace(/^[A-E]\s*(\u2026|\.\.\.)?\s*/, "").trim();
        out.push({emoji: CHOICE_EMOJI[i], letter: "ABCDE".charAt(i), label: label || ("\u9078\u629e\u80a2" + (i+1))});
      }
    }
  });
  return out;
}
function tsOf(iso){ var d = new Date(iso); return isNaN(d) ? Date.now() : d.getTime(); }

/* ---------- PCのランプ ---------- */
var askedPass = false;
function checkRejected(d){
  var rej = (d && d.rejected) || []; if (!rej.length || askedPass) return;
  var mine = []; try { mine = JSON.parse(localStorage.getItem("office_sent") || "[]"); } catch(e){}
  var hit = mine.some(function(id){ return rej.indexOf(id) >= 0; });
  if (!hit) return;
  askedPass = true;
  var g = document.getElementById("gate");
  g.querySelector("div").textContent = "合言葉が古いようです。新しい合言葉を入れてください";
  document.getElementById("pass").value = "";

}
function lamp(){
  readDoc(STATUS).then(function(d){
    checkRejected(d);
    var dot = document.getElementById("dot"), t = document.getElementById("lamp");
    var age = d.ts ? (Date.now()/1000 - d.ts) : 99999;
    if (age < 90) { dot.className = "dot ok"; t.textContent = "PCは動いています（" + Math.round(age) + "秒前に確認）"; }
    else { dot.className = "dot ng"; t.textContent = "PCの応答がありません。届いた指示は動き出しません"; }
  }).catch(function(){
    document.getElementById("dot").className = "dot ng";
    document.getElementById("lamp").textContent = "通信できません";
  });
}
function viewH(){
  var vv = window.visualViewport;
  return (vv && vv.height) ? Math.round(vv.height) : window.innerHeight;
}
function fitLayout(){
  var h = document.querySelector("header");
  var c = document.querySelector(".composer");
  var r = document.documentElement;
  /* キーボードが出ている間は、固定パネル（会話・入力欄）をキーボードの高さぶん持ち上げる（iPadのSafariはキーボードが画面にかぶさるため） */
  var VH = viewH();
  var vv = window.visualViewport;
  var kb = Math.max(0, window.innerHeight - VH - ((vv && vv.offsetTop) || 0));
  if (kb > 40) { r.style.setProperty("--kb", kb + "px"); document.body.classList.add("kbd"); window.scrollTo(0, 0); }
  else { r.style.setProperty("--kb", "0px"); document.body.classList.remove("kbd"); }
  var hh = h ? h.offsetHeight : 76;
  var ch = (c && c.offsetHeight) ? c.offsetHeight : 104;
  r.style.setProperty("--hh", hh + "px");
  r.style.setProperty("--ch", ch + "px");
  if (window.innerWidth < 900) return;
  /* 左の列＝画面の半分。絵は常に列いっぱい(3:2)。一覧は残りの高さにぴったり合わせる */
  var avail = viewH() - hh - ch - 20 - 8;   /* padding と gap */
  var leftw = Math.round(window.innerWidth * 0.5);
  var ow = leftw - 24, oh = ow * (924 / 1400);
  var rest = avail - oh;
  /* 10人が割り切れる並びだけ使う（空きマスを作らない）: 縦に余裕があれば2列×5行、無ければ5列×2行 */
  var cols = 2, rows = 5;
  if ((rest - 4 * 6) / 5 < 50) { cols = 5; rows = 2; }
  var th = (rest - (rows - 1) * 6) / rows;
  var MIN_TH = 46;                                   /* 名前＋役職の2行が読める最低の高さ */
  if (th < MIN_TH) {
    oh = Math.max(140, avail - (MIN_TH * rows + (rows - 1) * 6));
    ow = oh * (1400 / 924);
    th = (avail - oh - (rows - 1) * 6) / rows;
  }
  r.style.setProperty("--leftw", leftw + "px");
  r.style.setProperty("--officeh", Math.round(oh) + "px");
  r.style.setProperty("--gcols", cols);
  r.style.setProperty("--grows", rows);
  var g = document.getElementById("grid");
  if (g) g.className = "grid" + (th < 62 ? " compact" : "");
  var of = document.querySelector(".office");
  if (of) of.style.width = (ow < leftw - 24) ? Math.round(ow) + "px" : "";
}
window.addEventListener("resize", fitLayout);

/* iPadでキーボード（Typeless等）を閉じたあと、縮んだ表示領域が戻らないことがある → 何度か張り直す */
/* 横幅や拡大率が狂っていたら（iPadのキーボード後に起きる）、viewport meta を入れ直して元のサイズに戻す */
function fixZoom(){
  if (document.body.classList.contains("typing")) return false;   /* 入力中は触らない（画面が飛ぶ） */
  var vv = window.visualViewport;
  var scaleOff = vv && vv.scale && Math.abs(vv.scale - 1) > 0.02;
  var sw = (screen && screen.width) ? screen.width : 0;
  var widthOff = sw && window.innerWidth < sw * 0.85 && (vv && vv.width < sw * 0.85);
  if (!scaleOff && !widthOff) return false;
  var m = document.getElementById("vp");
  if (!m) return false;
  var base = "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover";
  m.setAttribute("content", "width=device-width,initial-scale=1.0001,maximum-scale=1,user-scalable=no,viewport-fit=cover");
  setTimeout(function(){ m.setAttribute("content", base); window.scrollTo(0, 0); fitLayout(); }, 30);
  return true;
}
function refit(){
  window.scrollTo(0, 0);
  fixZoom();
  fitLayout();
  [120, 400, 900, 1600].forEach(function(t){ setTimeout(function(){ window.scrollTo(0, 0); fixZoom(); fitLayout(); }, t); });
}

if (window.visualViewport) {
  var vvTimer = null;
  window.visualViewport.addEventListener("resize", function(){ clearTimeout(vvTimer); vvTimer = setTimeout(refit, 60); });
  window.visualViewport.addEventListener("scroll", function(){ clearTimeout(vvTimer); vvTimer = setTimeout(refit, 60); });
}
