<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>AIオフィス</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#1d2430; --sub:#6b7480;
    --line:#e4e0d7; --accent:#2f6f4e; --warn:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;letter-spacing:.02em}
  .lamp{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12px;color:var(--sub)}
  .dot{width:9px;height:9px;border-radius:50%;background:#bbb}
  .dot.ok{background:#2ecc71} .dot.ng{background:var(--warn)}
  main{padding:14px 16px 40px;max-width:1000px;margin:0 auto}
  .office{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    margin:0 auto 14px;background:var(--card);width:fit-content;max-width:100%}
  .office img{display:block;width:100%;max-width:100%}
  .face{position:absolute;left:50%;top:-14%;transform:translateX(-50%);width:46%;
    pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
  .seat{position:absolute;transform:translate(-50%,-50%);width:13%;height:17%;border:0;
    background:transparent;border-radius:14%;cursor:pointer;padding:0}
  .seat:active{background:rgba(47,111,78,.16)}
  .seat .tag{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);white-space:nowrap;
    background:rgba(255,255,255,.9);color:#1d2430;border-radius:999px;padding:1px 6px;
    font-size:clamp(8px,2.3vw,12px);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.16)}
  .seat .sdot{position:absolute;left:50%;top:-3px;transform:translateX(-50%);width:8px;height:8px;
    border-radius:50%;background:#cfd6dd;box-shadow:0 0 0 2px #fff}
  .seat.live .sdot{background:#2ecc71}
  .seat.none .tag{opacity:.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 13px 12px;
    text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
  .tile:active{transform:scale(.985)}
  .tile .nm{font-weight:700;font-size:15px}
  .tile .role{font-size:11.5px;color:var(--sub);margin-top:3px}
  .tile .last{font-size:11.5px;color:var(--sub);margin-top:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:29px}
  .badge{display:inline-block;margin-top:8px;font-size:11px;padding:2px 8px;border-radius:999px;
    background:#eef1ee;color:var(--sub)}
  .badge.sending{background:#fff3cd;color:#8a6d1f}
  .badge.done{background:#e6f3ec;color:var(--accent)}

  /* 会話画面 */
  #room{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);flex-direction:column}
  #room.on{display:flex}
  .rhead{display:flex;align-items:center;gap:10px;max-width:820px;width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
    border-bottom:1px solid var(--line);background:var(--bg)}
  .back{border:0;background:none;font:inherit;color:var(--accent);font-size:16px;font-weight:700;padding:8px 6px;margin:-4px 0;cursor:pointer}
  .rname{font-weight:700}
  .log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;
    width:100%;max-width:820px;margin:0 auto}
  .bub{max-width:84%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;
    word-break:break-word;align-self:flex-end;background:#dbeee2}
  .bub .t{display:block;font-size:10.5px;color:var(--sub);margin-top:4px}
  .bub.them{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  .bub{-webkit-user-select:text;user-select:text}
  .copy{display:block;width:100%;margin-top:9px;border:1px solid var(--accent);background:#eaf5ef;
    color:var(--accent);font:inherit;font-size:13.5px;font-weight:700;border-radius:10px;
    padding:9px 12px;cursor:pointer;text-align:center}
  .copy.done{background:var(--accent);color:#fff}
  .copy.img{margin-top:6px;margin-bottom:4px;font-size:12.5px;padding:7px 12px}
  .pick{display:block;width:100%;margin-top:7px;border:1px solid var(--accent);background:var(--accent);
    color:#fff;font:inherit;font-size:13.5px;font-weight:700;border-radius:10px;padding:10px 12px;
    cursor:pointer;text-align:left}
  .pick:disabled{opacity:.55}
  .pick.done{background:#8aa79a;border-color:#8aa79a}
  @media (prefers-color-scheme:dark){ .copy{background:#22392f} }
  .bub b{font-weight:700}
  .refresh{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;margin-left:auto;padding:6px}
  .empty{color:var(--sub);font-size:13px;text-align:center;margin-top:30px;line-height:1.7}
  .composer{border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
    background:var(--card);display:flex;gap:9px;align-items:flex-end}
  .cwrap{background:var(--card)}
  .composer{max-width:820px;margin:0 auto}
  textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;
    resize:none;max-height:160px;background:#fff;color:var(--ink)}
  .send{border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;
    padding:11px 16px;cursor:pointer}
  .send:disabled{opacity:.45}
  .pic{border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:19px;
    padding:8px 11px;cursor:pointer;line-height:1.2}
  .pic:disabled{opacity:.45}
  .bub img{display:block;max-width:100%;max-height:210px;width:auto;border-radius:9px;margin-bottom:5px;cursor:zoom-in}
  .bub img.big{max-height:none;width:100%}
  .thumb{padding:0 12px 8px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub)}
  .thumb img{height:52px;border-radius:8px;border:1px solid var(--line)}
  .thumb button{border:0;background:none;color:var(--warn);font:inherit;cursor:pointer}
  .hint{font-size:11px;color:var(--sub);padding:0 14px 8px;max-width:820px;width:100%;margin:0 auto}
  dialog{border:0;border-radius:16px;padding:20px;max-width:320px;width:86%}
  dialog input{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:10px}
  dialog button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--accent);
    color:#fff;font:inherit;font-weight:700}
  /* パソコン＝3段構え: ヘッダー ／ 左オフィス＋右会話 ／ 下いっぱいの入力欄 */
  @media (min-width:900px){
    body{overflow:hidden}
    main{position:fixed;left:0;top:74px;bottom:108px;width:38vw;max-width:none;
      padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
    .office{margin:0 auto;flex:0 0 auto}
    .office img{width:auto;height:auto;max-width:100%;max-height:44vh}
    .grid{flex:1 1 auto;overflow-y:auto;align-content:start;
      grid-template-columns:repeat(2,1fr);gap:7px}
    .tile{padding:7px 9px 6px;border-radius:10px}
    .tile .nm{font-size:12.5px}
    .tile .role{display:none}
    .tile .last{font-size:10.5px;margin-top:3px;min-height:0;-webkit-line-clamp:2}
    .badge{display:none}
    #room.on{position:fixed;left:38vw;right:0;top:74px;bottom:108px;width:auto;height:auto;
      border-left:1px solid var(--line);box-shadow:none}
    .rhead{max-width:none;padding-top:12px}
    .log,.hint{max-width:none}
    .hint{display:none}
    .thumb{max-width:none}
    .composer{position:fixed;left:0;right:0;bottom:0;height:108px;max-width:none;margin:0;
      z-index:21;border-top:1px solid var(--line);align-items:center;padding:12px 16px}
    textarea{max-height:84px;font-size:15px}
    .send{padding:13px 26px;font-size:15px}
    .pic{padding:10px 13px;font-size:21px}
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15181c;--card:#1e232a;--ink:#eef1f5;--sub:#98a2ae;--line:#2c333c;--accent:#4fb383}
    .bub{background:#26443a} .badge{background:#262d35} .badge.done{background:#22392f;color:#7fd0aa}
  }
</style>
</head>
<body>
<header>
  <h1>AIオフィス <span style="font-size:11px;color:#8a94a0;font-weight:400">v15</span></h1>
  <div class="lamp"><span class="dot" id="dot"></span><span id="lamp">確認中…</span></div>
</header>

<main>
  <div class="office" id="office">
    <img src="office_bg.jpg" alt="AIオフィス" id="bg">
  </div>
  <div class="grid" id="grid"></div>
</main>

<section id="room">
  <div class="rhead">
    <button class="back" id="back">‹ もどる</button>
    <div><div class="rname" id="rname"></div></div>
    <button class="refresh" id="reload">更新</button>
  </div>
  <div class="log" id="log"></div>
  <div class="hint" id="hint"></div>
  <div class="thumb" id="thumb" hidden></div>
  <div class="composer">
    <button class="pic" id="pic" title="写真を送る">📷</button>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="box" rows="1" placeholder="話しかける（マイク・画像の貼り付けもOK）"></textarea>
    <button class="send" id="send">送る</button>
  </div>
</section>

<dialog id="gate">
  <div style="font-weight:700">合言葉</div>
  <div style="font-size:12.5px;color:#6b7480;margin-top:6px">この端末では初回だけ聞きます。</div>
  <input id="pass" type="password" autocomplete="off">
  <button id="ok">はじめる</button>
</dialog>

<script>
var FB = { key:"AIzaSyDtDZIEQtBzjujnpTDcXt1QeEU2r-wbg74", proj:"kakigawatei-franchise" };
var INBOX = "ai_office_inbox", STATUS = "ai_office_status", FEED = "ai_office_feed";
var feed = {rooms:{}}, feedTimer = null;

var STAFF = [
  {id:"1532176222946197635", nm:"コン",   role:"LINE秘書",       x:16.8, y:28.6},
  {id:"1532175887494025398", nm:"ジニー", role:"ながおか探検録", x:41.1, y:25.2, face:"ginny"},
  {id:"1532176144999252038", nm:"リー",   role:"広告・動画",     x:67.1, y:27.6},
  {id:"1532176037109174503", nm:"ジョー", role:"経理・会計",     x:91.1, y:29.0},
  {id:"1532724627934154842", nm:"ポム",   role:"AI事業",         x:27.5, y:60.0},
  {id:"1532724546732425306", nm:"セレン", role:"リリース担当",   x:48.2, y:59.0},
  {id:"1532171159645458535", nm:"かねつぐ", role:"お客様窓口", x:67.9, y:59.0},
  {id:"1517471809392476282", nm:"バウ本部", role:"マーケ・全社", x:87.9, y:65.7},
  {id:"1542160237723648021", nm:"ずんだ", role:"柿川亭アプリ",   x:32.9, y:86.7},
  {id:"1542160436487528509", nm:"さくら", role:"山形出店",       x:53.2, y:87.1}
];

/* ---------- Firebase（匿名ログイン＋Firestore REST） ---------- */
var tok = null, exp = 0;
function jfetch(u, o){ return fetch(u, o).then(function(r){
  if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t.slice(0,120)); });
  return r.json(); }); }
function auth(){
  if (tok && Date.now() < exp) return Promise.resolve(tok);
  var r = null; try { r = localStorage.getItem("office_refresh"); } catch(e){}
  if (r) {
    return jfetch("https://securetoken.googleapis.com/v1/token?key=" + FB.key, {
      method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:"grant_type=refresh_token&refresh_token=" + encodeURIComponent(r)
    }).then(function(d){ tok = d.id_token; exp = Date.now() + (d.expires_in-60)*1000; return tok; })
      .catch(anon);
  }
  return anon();
}
function anon(){
  return jfetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + FB.key, {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({returnSecureToken:true})
  }).then(function(d){
    tok = d.idToken; exp = Date.now() + (d.expiresIn-60)*1000;
    try { localStorage.setItem("office_refresh", d.refreshToken); } catch(e){}
    return tok;
  });
}
function docUrl(id){
  return "https://firestore.googleapis.com/v1/projects/" + FB.proj +
         "/databases/(default)/documents/shime_docs/" + id;
}
function readDoc(id){
  return auth().then(function(t){
    return fetch(docUrl(id), {headers:{Authorization:"Bearer " + t}});
  }).then(function(r){
    if (r.status === 404) return {};
    if (!r.ok) throw new Error("read " + r.status);
    return r.json();
  }).then(function(d){
    var raw = d && d.fields && d.fields.json && d.fields.json.stringValue;
    if (!raw) return {};
    try { return JSON.parse(raw); } catch(e){ return {}; }
  });
}
function writeDoc(id, obj){
  return auth().then(function(t){
    return jfetch(docUrl(id), {
      method:"PATCH",
      headers:{Authorization:"Bearer " + t, "Content-Type":"application/json"},
      body: JSON.stringify({fields:{json:{stringValue: JSON.stringify(obj)}}})
    });
  });
}

/* ---------- 合言葉 ---------- */
var pass = null;
try { pass = localStorage.getItem("office_pass"); } catch(e){}
if (!pass) {
  var g = document.getElementById("gate"); g.showModal();
  document.getElementById("ok").onclick = function(){
    var v = document.getElementById("pass").value.trim();
    if (!v) return;
    pass = v; try { localStorage.setItem("office_pass", v); } catch(e){}
    g.close();
  };
}

/* ---------- ローカル履歴 ---------- */
function hist(room){
  try { return JSON.parse(localStorage.getItem("office_log_" + room) || "[]"); } catch(e){ return []; }
}
function pushHist(room, item){
  var a = hist(room); a.push(item); a = a.slice(-60);
  try { localStorage.setItem("office_log_" + room, JSON.stringify(a)); } catch(e){}
}

/* ---------- 一覧 ---------- */
function drawGrid(){
  var g = document.getElementById("grid"); g.innerHTML = "";
  STAFF.filter(function(x){ return x.id; }).forEach(function(s){
    var rows = (feed.rooms && feed.rooms[s.id]) || [];
    var h = hist(s.id), last = h.length ? h[h.length-1] : null;
    if (rows.length) {
      var r = rows[rows.length-1];
      last = {text:(r.me ? s.nm + "：" : "") + (r.text || (r.img && r.img.length ? "写真" : "")),
              ts:tsOf(r.ts), ok:true, thumb:(r.img && r.img.length ? r.img[0] : null)};
    }
    var b = document.createElement("button");
    b.className = "tile";
    b.innerHTML = '<div class="nm">' + s.nm + '</div>' +
      '<div class="role">' + s.role + '</div>' +
      '<div class="last">' + (last ? ((last.thumb ? "📷 " : "") + (esc(last.text).slice(0,60) || "写真")) : "—") + '</div>' +
      (last ? '<span class="badge ' + (last.ok ? "done" : "sending") + '">' +
        (last.ok ? "届いた " : "送信中 ") + when(last.ts) + '</span>' : "");
    b.onclick = function(){ openRoom(s); };
    g.appendChild(b);
  });
}
function esc(s){ return String(s).replace(/[<>&]/g, function(c){ return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]; }); }
function when(ts){
  var d = new Date(ts), n = new Date();
  var hm = ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
  return d.toDateString() === n.toDateString() ? hm : (d.getMonth()+1) + "/" + d.getDate();
}

/* ---------- 会話 ---------- */
var cur = null;
function openRoom(s){
  cur = s;
  document.getElementById("rname").textContent = s.nm + "（" + s.role + "）";
  document.getElementById("hint").textContent = "返事はDiscordの「" + s.nm + "」の部屋に届きます。";
  drawLog();
  document.getElementById("room").classList.add("on");
  if (location.hash !== "#room") history.pushState({room:1}, "", "#room");
  document.getElementById("box").focus();
  loadFeed();
  if (feedTimer) clearInterval(feedTimer);
  feedTimer = setInterval(loadFeed, 12000);
}
function drawLog(){
  var l = document.getElementById("log");
  var rows = (feed.rooms && feed.rooms[cur.id]) || [];
  var html = rows.map(function(m, i){
    var imgs = (m.img || []).map(function(u){
      return '<img src="' + u + '" alt="">' +
             '<button class="copy img" data-url="' + u + '">🖼 画像をコピー</button>';
    }).join("");
    var btn = (m.me && m.text) ? '<button class="copy" data-i="' + i + '">📋 この文をコピー</button>' : "";
    var ch = m.me ? parseChoices(m.text) : [];
    var chHtml = ch.map(function(c){
      return '<button class="pick" data-msg="' + m.id + '" data-emoji="' + encodeURIComponent(c.emoji) +
             '">' + c.letter + " … " + esc(c.label) + '</button>';
    }).join("");
    return '<div class="bub ' + (m.me ? "them" : "") + '">' + imgs + md(m.text) + chHtml + btn +
      '<span class="t">' + when(tsOf(m.ts)) + (m.me ? " ・" + cur.nm : "") + '</span></div>';
  });
  /* まだDiscordに写っていない直近の送信ぶんを足す */
  var seen = rows.map(function(m){ return (m.text || "").trim(); });
  hist(cur.id).forEach(function(m){
    if (Date.now() - m.ts > 120000) return;
    if (m.text && seen.indexOf(m.text.trim()) >= 0) return;
    html.push('<div class="bub">' + (m.thumb ? '<img src="' + m.thumb + '" alt="">' : "") +
      esc(m.text) + '<span class="t">' + when(m.ts) + (m.ok ? " ・届いた" : " ・送信中") + '</span></div>');
  });
  l.innerHTML = html.length ? html.join("")
    : '<div class="empty">まだやり取りがありません。<br>下の欄に打つか、マイクで話しかけてください。</div>';
  Array.prototype.forEach.call(l.querySelectorAll(".bub img"), function(im){
    im.onclick = function(){ im.className = im.className ? "" : "big"; };
  });
  Array.prototype.forEach.call(l.querySelectorAll(".pick"), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      Array.prototype.forEach.call(b.parentNode.querySelectorAll(".pick"), function(x){ x.disabled = true; });
      b.className = "pick done"; b.textContent = "\u2705 " + b.textContent;
      sendChoice(b.getAttribute("data-msg"), decodeURIComponent(b.getAttribute("data-emoji")));
    };
  });
  Array.prototype.forEach.call(l.querySelectorAll(".copy"), function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      var u = b.getAttribute("data-url");
      if (u) { copyImage(u, b); return; }
      var raw = (rows[+b.getAttribute("data-i")].text || "").replace(/\*\*/g, "");
      copyText(raw, b);
    };
  });
  l.scrollTop = l.scrollHeight;
}
/* 選択肢を押したら、Discordのその発言に絵文字を付けにいく＝Discordで押したのと同じ扱いになる */
function sendChoice(msgId, emoji){
  readDoc(INBOX).then(function(d){
    var msgs = d.msgs || [];
    msgs.push({ id:"c" + Date.now() + Math.floor(Math.random()*1000),
                room:cur.id, name:cur.nm, text:"", ts:Date.now(), pass:pass,
                react:{msg:msgId, emoji:emoji} });
    d.msgs = msgs.slice(-100);
    return writeDoc(INBOX, d);
  }).catch(function(e){ alert("\u9001\u308c\u307e\u305b\u3093\u3067\u3057\u305f\uff1a" + e.message); });
}
function copyText(t, btn){
  function done(){ btn.textContent = "✅ コピーしました"; btn.className = "copy done";
    setTimeout(function(){ btn.textContent = "📋 この文をコピー"; btn.className = "copy"; }, 1800); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, function(){ fallback(t, done); });
  } else { fallback(t, done); }
}
/* 画像をPNGにしてクリップボードへ（SafariはPNGのみ・押した瞬間にClipboardItemを作る必要がある） */
function toPng(url){
  return fetch(url, {mode:"cors"}).then(function(r){ return r.blob(); }).then(function(b){
    return new Promise(function(res, rej){
      var im = new Image(), o = URL.createObjectURL(b);
      im.onload = function(){
        var c = document.createElement("canvas");
        c.width = im.naturalWidth; c.height = im.naturalHeight;
        c.getContext("2d").drawImage(im, 0, 0);
        URL.revokeObjectURL(o);
        c.toBlob(function(png){ png ? res(png) : rej(new Error("png")); }, "image/png");
      };
      im.onerror = function(){ URL.revokeObjectURL(o); rej(new Error("load")); };
      im.crossOrigin = "anonymous"; im.src = o;
    });
  });
}
function copyImage(url, btn){
  var ok = function(){ btn.textContent = "✅ コピーしました"; btn.className = "copy img done";
    setTimeout(function(){ btn.textContent = "🖼 画像をコピー"; btn.className = "copy img"; }, 1800); };
  var ng = function(){ btn.textContent = "長押しして「写真に追加」";
    setTimeout(function(){ btn.textContent = "🖼 画像をコピー"; }, 2600); };
  if (!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)) { ng(); return; }
  try {
    navigator.clipboard.write([ new ClipboardItem({ "image/png": toPng(url) }) ]).then(ok, ng);
  } catch(e){ ng(); }
}
function fallback(t, done){
  var ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ alert("コピーできませんでした"); }
  document.body.removeChild(ta);
}
function closeRoom(){
  document.getElementById("room").classList.remove("on");
  if (feedTimer) { clearInterval(feedTimer); feedTimer = null; }
  cur = null; drawGrid();
}
document.getElementById("back").onclick = function(){
  if (location.hash === "#room") { history.back(); } else { closeRoom(); }
};
window.addEventListener("popstate", function(){
  if (location.hash !== "#room") closeRoom();
});
var box = document.getElementById("box");
box.addEventListener("input", function(){ box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight,160) + "px"; });

/* ---------- 写真 ---------- */
var pending = null;   /* {full:dataURL(送信用), thumb:dataURL(履歴表示用)} */

function shrink(file, maxSide, quality){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var w = img.width, h = img.height, r = Math.min(1, maxSide / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.round(w * r); c.height = Math.round(h * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("画像を読めません")); };
    img.src = url;
  });
}

/* Firestore の1通の上限(約1MB)に収まるまで落とす */
function fitForSend(file){
  var plan = [[1400,.72],[1200,.66],[1000,.6],[820,.55]];
  var i = 0;
  function step(){
    return shrink(file, plan[i][0], plan[i][1]).then(function(d){
      if (d.length < 700000 || i >= plan.length - 1) return d;
      i++; return step();
    });
  }
  return step();
}

document.getElementById("pic").onclick = function(){ document.getElementById("file").click(); };
document.getElementById("file").onchange = function(){
  var f = this.files && this.files[0]; this.value = "";
  attachFile(f);
};
function attachFile(f){
  if (!f) return;
  var t = document.getElementById("thumb");
  t.hidden = false; t.textContent = "写真を準備しています…";
  Promise.all([fitForSend(f), shrink(f, 240, .6)]).then(function(a){
    pending = {full:a[0], thumb:a[1]};
    t.innerHTML = "";
    var im = new Image(); im.src = pending.thumb; t.appendChild(im);
    var sp = document.createElement("span");
    sp.textContent = "写真を1枚 添付（" + Math.round(pending.full.length/1400) + "KB）";
    t.appendChild(sp);
    var bt = document.createElement("button"); bt.textContent = "やめる";
    bt.onclick = function(){ pending = null; t.hidden = true; t.innerHTML = ""; };
    t.appendChild(bt);
  }).catch(function(e){
    t.hidden = true; alert("写真を読めませんでした：" + e.message);
  });
}

/* 貼り付け（Ctrl+V / Cmd+V）で画像を添付 */
document.addEventListener("paste", function(e){
  if (!document.getElementById("room").classList.contains("on")) return;
  var items = (e.clipboardData && e.clipboardData.items) || [];
  for (var i = 0; i < items.length; i++) {
    if ((items[i].type || "").indexOf("image/") === 0) {
      var f = items[i].getAsFile();
      if (f) { e.preventDefault(); attachFile(f); return; }
    }
  }
});

/* パソコンのキーボードのときだけ Enter で送信（Shift+Enter は改行） */
box.addEventListener("keydown", function(e){
  if (e.key !== "Enter" || e.shiftKey) return;
  if (e.isComposing || e.keyCode === 229) return;      /* 日本語の変換中は送らない */
  if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
  e.preventDefault();
  document.getElementById("send").click();
});

document.getElementById("send").onclick = function(){
  var text = box.value.trim(); if ((!text && !pending) || !cur) return;
  var btn = this; btn.disabled = true;
  var shot = pending; pending = null;
  var t = document.getElementById("thumb"); t.hidden = true; t.innerHTML = "";
  var mid = "m" + Date.now() + Math.floor(Math.random()*1000);
  var item = {text:text, ts:Date.now(), ok:false, thumb: shot ? shot.thumb : null};
  pushHist(cur.id, item); box.value = ""; box.style.height = "auto"; drawLog();

  var first = shot ? writeDoc("ai_office_img_" + mid, {b64: shot.full}) : Promise.resolve();
  first.then(function(){ return readDoc(INBOX); }).then(function(d){
    var msgs = d.msgs || [];
    msgs.push({ id:mid, room:cur.id, name:cur.nm, text:text, ts:Date.now(), pass:pass,
                img: shot ? ("ai_office_img_" + mid) : null });
    d.msgs = msgs.slice(-100);
    return writeDoc(INBOX, d);
  }).then(function(){
    var a = hist(cur.id); if (a.length) { a[a.length-1].ok = true;
      try { localStorage.setItem("office_log_" + cur.id, JSON.stringify(a)); } catch(e){} }
    drawLog();
  }).catch(function(e){
    alert("送れませんでした：" + e.message);
  }).then(function(){ btn.disabled = false; });
};

/* ---------- 返事の取り込み（PCの受け取り係がDiscordを読んで置いてくれる） ---------- */
function loadFeed(){
  return readDoc(FEED).then(function(d){
    if (d && d.rooms) { feed = d; if (cur) drawLog(); drawGridQuiet(); drawSeats(); }
  }).catch(function(){});
}
/* いまの様子を、直近のやり取りから決める */
function mood(st){
  var rows = (st.id && feed.rooms && feed.rooms[st.id]) || [];
  if (!rows.length) return "free";
  var last = rows[rows.length-1];
  if (!last.me) return "busy";                       /* masaが投げた直後＝私が動いている */
  if (/[？?]\s*$|ください|どちらに|選んで|教えて|いいですか|ますか/.test(last.text || "")) return "wait";
  return "free";
}
function drawSeats(){
  var o = document.getElementById("office");
  Array.prototype.forEach.call(o.querySelectorAll(".seat"), function(e){ e.remove(); });
  STAFF.forEach(function(st){
    if (st.x == null) return;
    var b = document.createElement("button");
    b.className = "seat" + (st.id ? "" : " none");
    b.style.left = st.x + "%"; b.style.top = st.y + "%";
    var rows = (st.id && feed.rooms && feed.rooms[st.id]) || [];
    if (rows.length) b.className += " live";
    var fh = st.face ? '<img class="face" src="faces/' + st.face + "_" + mood(st) + '.png" alt="">' : "";
    b.innerHTML = fh + '<span class="sdot"></span><span class="tag">' + st.nm + '</span>';
    b.onclick = function(){
      if (!st.id) { alert(st.nm + "さんの部屋は、まだDiscordに作っていません。作るならmasaの一声で用意します。"); return; }
      openRoom(st);
    };
    o.appendChild(b);
  });
}
function drawGridQuiet(){ if (!document.getElementById("room").classList.contains("on")) drawGrid(); }
function md(t){
  return esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}
var CHOICE_EMOJI = ["🇦","🇧","🇨","🇩","🇪"];
function parseChoices(t){
  var out = [];
  (t || "").split("\n").forEach(function(line){
    var s2 = line.trim();
    for (var i = 0; i < CHOICE_EMOJI.length; i++) {
      if (s2.indexOf(CHOICE_EMOJI[i]) === 0) {
        var label = s2.slice(CHOICE_EMOJI[i].length).replace(/\*\*/g, "").trim();
        label = label.replace(/^[A-E]\s*(\u2026|\.\.\.)?\s*/, "").trim();
        out.push({emoji: CHOICE_EMOJI[i], letter: "ABCDE".charAt(i), label: label || ("\u9078\u629e\u80a2" + (i+1))});
      }
    }
  });
  return out;
}
function tsOf(iso){ var d = new Date(iso); return isNaN(d) ? Date.now() : d.getTime(); }

/* ---------- PCのランプ ---------- */
function lamp(){
  readDoc(STATUS).then(function(d){
    var dot = document.getElementById("dot"), t = document.getElementById("lamp");
    var age = d.ts ? (Date.now()/1000 - d.ts) : 99999;
    if (age < 90) { dot.className = "dot ok"; t.textContent = "PCは動いています（" + Math.round(age) + "秒前に確認）"; }
    else { dot.className = "dot ng"; t.textContent = "PCの応答がありません。届いた指示は動き出しません"; }
  }).catch(function(){
    document.getElementById("dot").className = "dot ng";
    document.getElementById("lamp").textContent = "通信できません";
  });
}
document.getElementById("reload").onclick = loadFeed;
drawGrid(); drawSeats(); lamp(); loadFeed(); setInterval(lamp, 20000);
